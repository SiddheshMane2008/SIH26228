operating_mode: OFFLINE_AIR_GAPPED

embedder:
  name: mobilenet_v3
  fallback: mobilenet_v3
  cache_embeddings: true
  device: cpu

data_sentinel:
  phash_hamming_threshold: 6
  embedding_similarity_threshold: 0.96
  ood_percentile_cutoff: 95.0
  label_flip_confidence_min: 0.65
  patch_trigger_size: 16
  trigger_repetition_threshold: 3
  contributor_flag_ratio: 0.15

model_auditor:
  golden_battery_size: 20
  golden_battery_tolerance: 0.05
  trigger_sweep_locations: 4
  trigger_sweep_sizes: [8, 16, 24]
  weight_outlier_sigma: 4.0

provenance:
  hash_algorithm: sha256
  signature_algorithm: ed25519
  spot_check_sample_rate: 0.25
  spot_check_tolerance: 0.0001
  watermark_policy: VISIBLE
  c2pa_sidecar_enabled: true

shift:
  bins: 20
  psi_review_threshold: 0.15
  psi_quarantine_threshold: 0.30
  wasserstein_review_threshold: 0.10
  embedding_drift_threshold: 0.25

output_dir: runs
